<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <link rel="stylesheet"href="style.css">

</head>

<body class="bg-light">

  

  <div class="container mt-5">

    <div class="row justify-content-center">

      <div class="col-md-6 col-lg-4">

        <div class="card shadow-lg">

          <div class="card-body">

            <h1 class="card-title text-center mb-4">

              <i class="bi bi-palette"></i> Art Portfolio

            </h1>

            <p class="text-center text-muted mb-4">Please login to continue</p>

            

            <form id="loginForm">

              <div class="mb-3">

                <label for="name" class="form-label">Name</label>

                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>

              </div>

              

              <div class="mb-3">

                <label for="gmail" class="form-label">Email</label>

                <input type="email" class="form-control" id="gmail" placeholder="Enter your email" required>

              </div>

              

              <div class="mb-3">

                <label for="pass" class="form-label">Password</label>

                <input type="password" class="form-control" id="pass" placeholder="Enter your password" required>

              </div>

              

              <div class="mb-4">

                <label for="num" class="form-label">Contact Number</label>

                <input type="tel" class="form-control" id="num" placeholder="Enter your contact number" required>

              </div>

              

              <button type="button" class="btn btn-primary btn-lg w-100" onclick="

                const inputelement=document.querySelector('#name');

                document.querySelector('#h').innerHTML=`${inputelement.value}`;

                const inputelemen=document.querySelector('#gmail');

                document.querySelector('#hh').innerHTML=`${inputelemen.value}`;

                const inputelemet=document.querySelector('#pass');

                document.querySelector('#hhh').innerHTML=`${inputelemet.value}`;

                const inpuelement=document.querySelector('#num');

                document.querySelector('#hhhh').innerHTML=`${inpuelement.value}`;

                window.location.href='new.html';

              ">Submit</button>

            </form>

            

            <div class="mt-3 text-center">

              <small id="h" class="text-muted d-block"></small>

              <small id="hh" class="text-muted d-block"></small>

              <small id="hhh" class="text-muted d-block"></small>

              <small id="hhhh" class="text-muted d-block"></small>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

 

 <script src="script.js"></script>

</body>

</html>
