<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet"href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 3rem;
      margin: 2rem 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    .category-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 2rem;
      margin: 1rem 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }
    .btn-custom {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin: 5px;
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      color: white;
    }
    .section-title {
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .icon-large {
      font-size: 3rem;
      color: #667eea;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero Section -->
    <div class="hero-section text-center text-white">
      <h1 class="display-3 fw-bold mb-4">
        <i class="bi bi-palette2"></i> Art Portfolio
      </h1>
      <p class="lead mb-4">Welcome to my creative journey through art and imagination</p>
      
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="d-flex flex-wrap justify-content-center">
            <a href="hist.html" class="btn btn-custom m-2">
              <i class="bi bi-clock-history"></i> History
            </a>
            <a href="about.html" class="btn btn-custom m-2">
              <i class="bi bi-brush"></i> About Drawing
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- My Drawings Section -->
    <div class="category-card">
      <h2 class="section-title">
        <i class="bi bi-person-workspace"></i> My Drawings
      </h2>
      <p class="text-muted mb-4">Artwork created during my school days</p>
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <a href="god.html" class="btn btn-outline-primary btn-lg w-100">
            <i class="bi bi-cross"></i> God
          </a>
        </div>
        <div class="col-md-6 mb-3">
          <a href="home.html" class="btn btn-outline-success btn-lg w-100">
            <i class="bi bi-house"></i> Homes
          </a>
        </div>
        <div class="col-md-6 mb-3">
          <a href="pokemons.html" class="btn btn-outline-warning btn-lg w-100">
            <i class="bi bi-lightning"></i> Pokemons
          </a>
        </div>
        <div class="col-md-6 mb-3">
          <a href="other.html" class="btn btn-outline-info btn-lg w-100">
            <i class="bi bi-stars"></i> Other
          </a>
        </div>
      </div>
    </div>

    <!-- Sister's Drawings Section -->
    <div class="category-card">
      <h2 class="section-title">
        <i class="bi bi-heart"></i> Sister's Drawings
      </h2>
      <p class="text-muted mb-4">Beautiful artwork by my talented sister</p>
      
      <div class="row">
        <div class="col-12">
          <a href="click.html" class="btn btn-outline-danger btn-lg w-100">
            <i class="bi bi-camera"></i> View Gallery
          </a>
        </div>
      </div>
    </div>

    <!-- About Section -->
    <div class="text-center mt-4 mb-5">
      <hr class="my-4">
      <a href="my.html" class="btn btn-custom btn-lg">
        <i class="bi bi-person-circle"></i> About Me
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
